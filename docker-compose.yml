services:
  postgres:
    image: postgres:16-alpine
    container_name: payout_postgres
    environment:
      POSTGRES_DB: payout_dev
      POSTGRES_USER: payout_user
      POSTGRES_PASSWORD: payout_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout_user -d payout_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payout_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
